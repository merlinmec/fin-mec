spring:
  profiles:
    active: dev
  # Igual ao main: sem isto o Hibernate nunca confere entidade x schema nos testes, e um tipo
  # de coluna errado só aparecia no boot real (aconteceu na Fase 8 e de novo na Fase 17).
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  # Igual ao main (sem isto os testes rodavam com o padrão de 1 MB do Spring, não o do app).
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

# Mesmo nome de cookie do main (Spring Session usaria "SESSION"): este arquivo substitui o de main.
server:
  servlet:
    session:
      cookie:
        name: JSESSIONID
  datasource:
    password: test-only-placeholder

# Este arquivo SUBSTITUI (não mescla com) src/main/resources/application.yml nos
# testes. O prefixo /api dos @RestController vem do bean WebConfig (@Configuration
# comum, carregado pelo Spring context dos testes igual qualquer outro bean) — não
# precisa replicar nada aqui pra esse fim. Mas o base-path do actuator é uma
# PROPRIEDADE (a autoconfiguração do Actuator lê de application.yml, não de um
# bean), então essa sim precisa ser replicada — descoberto só na CI (clean
# checkout, sem target/ residual) depois desta config ter passado localmente por
# engano com classes de teste desatualizadas em cache.
management:
  endpoints:
    web:
      base-path: /api/actuator

mecfin:
  rate-limit:
    # Alto o bastante para nao ser atingido por chamadas de registro de outros testes
    # na mesma suite (todas compartilham o mesmo IP de loopback). O limite de login
    # permanece no valor real: o teste dedicado de rate limit usa e-mail unico por
    # execucao, entao nao ha contaminacao entre testes nesse bucket.
    register-per-minute: 1000
  security:
    encryption-key: dGVzdC1vbmx5LWtleS0zMi1ieXRlcy1sb25nLW9rISE=
    lockout:
      # Abaixo do rate limit de login (5/min por IP+e-mail) para o bloqueio ser observável num
      # teste que sempre sai do mesmo IP de loopback.
      max-attempts: 3
  app:
    base-url: http://localhost:5173
  mail:
    from: fin-mec <no-reply@fin-mec.test>
  pluggy:
    # Os testes que usam o provedor sobem um Pluggy falso e sobrescrevem estes valores.
    base-url: http://localhost:1
    client-id: ""
    client-secret: ""
