spring:
  application:
    name: mec-fin

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mecfin}
    username: ${DB_USER:mecfin}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  servlet:
    # Toda a API (e o actuator, que compartilha a porta) fica sob /api, deixando a
    # raiz livre para o SPA servir seus assets em produção sem colisão de rotas.
    # Rotas de @RequestMapping e matchers do Spring Security seguem relativos ao
    # contexto (não levam o prefixo).
    context-path: /api
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: dev

server:
  servlet:
    session:
      cookie:
        secure: false
