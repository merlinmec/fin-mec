# Produção do fin-mec numa VPS qualquer com Docker. Uso (ver docs/DEPLOY.md):
#   cp .env.prod.example .env.prod   # e preencha
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Rede: só o Caddy publica portas (80/443). O Postgres e a aplicação ficam na rede interna do
# compose — banco nunca exposto; actuator (9090, métricas) só alcançável de dentro.
name: fin-mec

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mecfin}
      POSTGRES_USER: ${DB_USER:-mecfin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env.prod}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mecfin} -d ${DB_NAME:-mecfin}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: fin-mec:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mecfin}
      DB_USER: ${DB_USER:-mecfin}
      DB_PASSWORD: ${DB_PASSWORD}
      MECFIN_ENCRYPTION_KEY: ${MECFIN_ENCRYPTION_KEY:?defina MECFIN_ENCRYPTION_KEY no .env.prod}
      MECFIN_BASE_URL: ${MECFIN_BASE_URL:?defina MECFIN_BASE_URL (https://seu-dominio) no .env.prod}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-fin-mec <no-reply@localhost>}
    expose:
      - "8080"
    healthcheck:
      # A imagem não tem curl/wget: HTTP "na mão" pelo /dev/tcp do bash até o actuator (porta 9090).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9090 && printf 'GET /api/actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?defina DOMAIN no .env.prod}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGDATABASE: ${DB_NAME:-mecfin}
      PGUSER: ${DB_USER:-mecfin}
      PGPASSWORD: ${DB_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/scripts/backup.sh:ro
      - ./deploy/restore-check.sh:/scripts/restore-check.sh:ro
      - backups:/backups
    entrypoint: ["bash", "/scripts/backup.sh"]

volumes:
  db-data:
  caddy-data:
  caddy-config:
  backups:
