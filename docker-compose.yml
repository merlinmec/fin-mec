services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${DB_NAME:-mecfin}
      POSTGRES_USER: ${DB_USER:-mecfin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mecfin-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mecfin} -d ${DB_NAME:-mecfin}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SMTP falso para desenvolvimento: captura os e-mails (redefinição de senha, alertas) e mostra
  # numa caixa de entrada web em http://localhost:8025. Ligue com MAIL_HOST=localhost no .env.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mecfin-postgres-data:
